<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Notifications</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="page-header">
        <h1>Leave Applications</h1>
        <p>Principal Approval Panel</p>
    </div>

    <div class="filter-buttons">

        <button class="filter active" data-status="Pending">
            Pending
        </button>

        <button class="filter" data-status="Approved">
            Approved
        </button>

        <button class="filter" data-status="Rejected">
            Rejected
        </button>

    </div>

    <div id="leaveContainer" class="leave-list">

    </div>

</div>

<script src="js/principal-notifications.js"></script>

</body>
</html>
