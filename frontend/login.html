
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Login - School Relief System</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/login.js" defer></script>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #F5F7F8;
        }

        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 12px 35px rgba(20, 43, 69, 0.08);
        }

        .login-card h2 {
            color: #142B45;
            margin-bottom: 10px;
            text-align: center;
        }

        .login-card .intro {
            text-align: center;
            color: #718096;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .login-card label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600;
            color: #263746;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #E1E8ED;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-card input:focus {
            outline: 2px solid #0F8B8D;
            border-color: transparent;
        }

        .login-card button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #0F8B8D;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-card button:hover {
            background: #087477;
        }

        .login-card button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #0F8B8D;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="static/home.html"
           style="text-decoration:none; color:inherit;">
            <h2>School Relief System</h2>
        </a>
    </nav>

    <main class="login-container">

        <section class="login-card">

            <h2>Employee Login</h2>

            <p class="intro">
                Log in to your employee account to submit a leave application.
            </p>

            <form id="loginForm">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="loginButton">
                    Login
                </button>

            </form>

            <p id="message" role="alert" aria-live="polite"></p>

            <a href="static/home.html" class="back-link">
                ← Back to Home
            </a>

        </section>

    </main>

</body>
</html>
