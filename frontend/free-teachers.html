<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Relief System - Free Teacher Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/free-teachers.js" defer></script>
</head>
<body>

    <nav class="navbar">
        <h2>School Relief System</h2>
    </nav>

    <main class="availability-page">
        <header class="availability-header">
            <div>
                <p class="eyebrow">SCHOOL ADMINISTRATION</p>
                <h1>Free Teacher Dashboard</h1>
                <p>Find available teachers and lessons needing relief.</p>
            </div>
        </header>

        <section class="availability-panel">
            <div class="date-heading">
                <div>
                    <h2 id="selected-day">Loading date...</h2>
                    <p id="selected-date"></p>
                </div>
                <button id="today-button" type="button">Today</button>
            </div>

            <nav id="workday-navigation" class="workday-navigation" aria-label="Choose a working day">
                <!-- Dynamically populated 5 workdays -->
            </nav>

            <p id="availability-message" role="status" aria-live="polite">Loading availability...</p>

            <div id="period-list" class="period-list">
                <!-- Dynamically populated periods -->
            </div>
        </section>
    </main>

</body>
</html>
