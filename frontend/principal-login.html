
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal Login | School Relief System</title>

    <link rel="stylesheet" href="css/principal-login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="icon">🏫</div>

            <h1>Principal Portal</h1>

            <p class="subtitle">
                School Relief Management System
            </p>

            <form id="principalLoginForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter Principal username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <p id="message"></p>

                <button type="submit" id="loginButton">
                    Principal Login
                </button>

            </form>

            <a href="/" class="back-link">Back to Home</a>

        </div>

    </div>

    <script src="js/principal-login.js"></script>

</body>
</html>
