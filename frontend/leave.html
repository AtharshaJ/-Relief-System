
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Relief System - Leave Application</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/leave.js" defer></script>
</head>

<body>

    <nav class="navbar">
        <a href="static/home.html"
           style="text-decoration:none; color:inherit;">
            <h2>School Relief System</h2>
        </a>

        <button type="button" id="logoutButton">
            Logout
        </button>
    </nav>

    <main class="container">

        <section class="card">

            <h2>Teacher Leave Application</h2>

            <p class="intro">
                Submit a leave request for the selected dates.
            </p>
            <p id="selectedLeaveType"></p>

            <!-- Logged-in employee details -->
            <div id="employeeDetails">
                Loading employee details...
            </div>

            <form id="leaveForm" hidden>

                <div class="form-group">
    <label for="startDate">Date of Commencing Leave</label>
    <input type="date" id="startDate" required>
</div>

<div class="form-group" id="endDateGroup">
    <label for="endDate">Last Day of Leave</label>
    <input type="date" id="endDate" required>
</div>

<div class="form-group" id="leaveDaysGroup">
    <label for="leaveDays">Number of Leave Days</label>
    <input
        type="number"
        id="leaveDays"
        min="0.5"
        step="0.5"
        required
    >
</div>

                <label for="reason">Reason</label>
                <textarea
                    id="reason"
                    rows="4"
                    placeholder="Enter reason for leave (optional)">
                </textarea>

                <button type="submit" id="submitButton">
                    Submit Leave Request
                </button>

            </form>

            <p id="message" role="status" aria-live="polite"></p>

        </section>

    </main>

</body>
</html>
